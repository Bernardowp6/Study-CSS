<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link href="ToDo.css"  rel="stylesheet">
</head>

<body>

    <main>
        <h1>To-Do list</h1>

    <ul class="todo-list">

        <div class="blocks">
        <li>
            <input type="checkbox" id="unique1">
            <label for="unique1">Exercises of CSS</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://classroom-siteswiki-org.translate.goog/login-to-google-classroom?_x_tr_sl=en&_x_tr_tl=pt&_x_tr_hl=pt&_x_tr_pto=tc" target="_blank">Google Classroom</a></li>
            </ul>

        </li>
        </div>


        <div class="blocks">
  <li>
            <input type="checkbox" id="unique2">
            <label for="unique2">Buy Food</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.ifood.com.br" target="_blank">Ifood</a></li>
            </ul>

        </li>
        </div>

        <div class="blocks">

  <li>
            <input type="checkbox" id="unique3">
            <label for="unique3">Organize Calendar</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://calendar.google.com/calendar/u/3/r/month/2026/11/23" target="_blank">Google Calendar</a></li>
            </ul>

        </li>
        </div>

    <div class="blocks">
  <li>
            <input type="checkbox" id="unique4">
            <label for="unique4">Learn about Xadrez</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.chess.com/home" target="_blank">Chess.com</a></li>
            </ul>

        </li>
        </div>



    </ul>
    </main>

</body>

</html>
